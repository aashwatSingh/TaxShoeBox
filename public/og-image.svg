<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="TaxShoe — Effortless Tax Organization">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#050510"/>
      <stop offset="30%" stop-color="#0d0927"/>
      <stop offset="55%" stop-color="#1a0f3a"/>
      <stop offset="80%" stop-color="#0f1a40"/>
      <stop offset="100%" stop-color="#080f2e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#fcd34d"/>
      <stop offset="50%"  stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d4a843"/>
    </linearGradient>
    <radialGradient id="orb1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6d28d9" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d4a843" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#d4a843" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="180" cy="120" r="320" fill="url(#orb1)"/>
  <circle cx="1050" cy="560" r="360" fill="url(#orb2)"/>
  <circle cx="680" cy="80"  r="220" fill="url(#orb1)"/>

  <text x="600" y="270" text-anchor="middle" font-size="110">🗂️</text>
  <text x="600" y="400" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="128" font-weight="700" fill="url(#gold)">TaxShoe</text>
  <text x="600" y="465" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="32" fill="#a9a3c2" letter-spacing="3">Effortless Tax Organization</text>

  <g font-family="-apple-system, 'Segoe UI', sans-serif" font-size="20" fill="#8d87ad">
    <rect x="300" y="520" rx="22" ry="22" width="230" height="44" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="415" y="548" text-anchor="middle">🔐 Row-Level Security</text>
    <rect x="550" y="520" rx="22" ry="22" width="210" height="44" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="655" y="548" text-anchor="middle">⚛️ React + Supabase</text>
    <rect x="780" y="520" rx="22" ry="22" width="120" height="44" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="840" y="548" text-anchor="middle">✨ Demo</text>
